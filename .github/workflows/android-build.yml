# CI build for GameSpace.
#
# Uses the committed Gradle wrapper (gradlew + gradle-wrapper.jar) which
# bootstraps the correct Gradle version automatically. No manual Gradle
# install needed — the wrapper handles everything.
#
# SDK: compileSdk 36, minSdk 29, targetSdk 36.
# The runner may already have android-36 pre-installed; the sdkmanager
# step is a best-effort fallback wrapped in continue-on-error so the
# build step itself surfaces a clear error if the platform is missing.

name: Android CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Install Android SDK platform 36 / build-tools (best effort)
        continue-on-error: true
        run: |
          {
            SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "Platforms on this runner:"
            ls "$SDK_ROOT/platforms" 2>&1 || echo "(none)"

            if ! command -v sdkmanager &>/dev/null; then
              # Try the standard SDK cmdline-tools path
              CMDLINE="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
              if [ -x "$CMDLINE" ]; then
                export PATH="$(dirname "$CMDLINE"):$PATH"
              else
                echo "sdkmanager not found — continuing on pre-installed SDK."
                exit 0
              fi
            fi

            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>&1
          } 2>&1 | tee build-output.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build-output.log

      - name: Run unit tests
        if: always()
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a build-output.log

      - name: Run lint
        if: always()
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace 2>&1 | tee -a build-output.log

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo ""
            echo "Full log: see the \`build-log\` artifact below."
            echo ""
            echo "### Last 80 log lines"
            echo '```'
            tail -n 80 build-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # if: always() on logs/reports — they matter most when the build fails.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: app/build/reports
          retention-days: 14
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
